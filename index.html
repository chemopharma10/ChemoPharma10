<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<head>
    <!-- SwiperJS CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />

<!-- SwiperJS JS -->
<!--<script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script> -->
<script src="swiper-bundle.min.js"></script>

</head>
<style>

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden; /* Prevent scrolling */
}

.container {
  position: relative;
  width: 100vw;
  height: 100vh;
}

.mySlides img {
  width: 100vw;
  height: 100vh;
  object-fit: cover; /* Ensures image fills screen without distortion */
}



</style>
<body>



<h2 style="text-align:center"></h2>

<div class="container">

    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="images\chemo\img1.jpeg"></div>
            <div class="swiper-slide"><img src="images\chemo\img2.jpeg" /></div>
            <div class="swiper-slide"><img src="images\chemo\img3.jpeg" /></div>
            <div class="swiper-slide"><img src="images\chemo\img4.jpeg"></div>
            <div class="swiper-slide"><img src="images\chemo\img5.jpeg" /></div>
            <div class="swiper-slide"><img src="images\chemo\img6.jpeg" /></div>
            <div class="swiper-slide"><img src="images\chemo\img7.jpeg"></div>
            <div class="swiper-slide"><img src="images\chemo\img8.jpeg" /></div>
            <div class="swiper-slide"><img src="images\chemo\img9.jpeg" /></div>
            <!-- Add more slides as needed -->
        </div>

        <!-- Navigation buttons -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>

        <!-- Pagination -->
        <div class="swiper-pagination"></div>
    </div>
</div>
  <div class="caption-container">
    <p id="caption"></p>
  </div>


<script>

const swiper = new Swiper('.mySwiper', {
  loop: true,
  //toplay: {
  //delay: 3000,
  //disableOnInteraction: false,
  //
  pagination: {
    el: '.swiper-pagination',
    clickable: true,
  },
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev',
  },
});



</script>
    
</body>
</html>
